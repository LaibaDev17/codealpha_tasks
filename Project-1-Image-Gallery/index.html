<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeasonScope | A Year in Moments</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <a href="#home" class="logo">
            <span>Season</span>Scope
        </a>
        <nav class="nav-links">
            <a href="#gallery" class="nav-link active" data-filter="all">
                All 
            </a>
            <a href="#gallery" class="nav-link" data-filter="spring">
                Spring
            </a>
            <a href="#gallery" class="nav-link" data-filter="summer">
                Summer
            </a>
            <a href="#gallery" class="nav-link" data-filter="autumn">
                Autumn
            </a>
            <a href="#gallery" class="nav-link" data-filter="winter">
                Winter
            </a>
        </nav>
    </header>
    <main id="home">
        <section class="hero">
            <div class="hero-content">
                <p class="hero-small">
                    A YEAR IN MOMENTS
                </p>
                <h1>
                    Seasons,
                    <span>Captured.</span>
                </h1>
                <p class="hero-description">
                    Explore the beauty of nature through four seasons.
                </p>
                <a href="#gallery" class="scroll-btn">
                    Explore
                    <i class="fa-solid fa-arrow-down"></i>
                </a>
            </div>
        </section>
        <section class="gallery-section" id="gallery">
            <div class="gallery-heading">
                <p>THE COLLECTION</p>
                <h2>Four Seasons</h2>
            </div>
            <div class="gallery">
                <div class="gallery-item" data-category="spring" data-title="Cherry Blossom" data-season="Spring">
                    <img src="images/cherry blossom.jpg" alt="Cherry Blossom" loading="lazy">
                    <div class="image-number">
                        01
                    </div>
                </div>
                 <div class="gallery-item" data-category="spring" data-title="Spring Garden" data-season="Spring">
                    <img src="images/Spring Garden.jpg" alt="Spring Garden" loading="lazy">
                    <div class="image-number">
                        02
                    </div>
                </div>
                 <div class="gallery-item" data-category="spring" data-title="Wonder Tree" data-season="Spring">
                    <img src="images/wonder tree.jpg" alt=" Spring tree" loading="lazy">
                    <div class="image-number">
                        03
                    </div>
                </div>
                
               
                <div class="gallery-item" data-category="spring" data-title="Blooming Flowers" data-season="Spring">
                    <img src="images/Blomming flowers.jpg" alt="Blooming Flowers" loading="lazy">
                    <div class="image-number">
                        04
                    </div>
                </div>
                <div class="gallery-item" data-category="summer" data-title="Summer Beach" data-season="Summer">
                    <img src="images/summer beach.jpg" alt="Summer Beach" loading="lazy">
                    <div class="image-number">
                        05
                    </div>

                </div>
                 
                <div class="gallery-item" data-category="summer" data-title="Resort" data-season="Summer">
                    <img src="images/resort.jpg" alt="Resort" loading="lazy">
                    <div class="image-number">
                        06
                    </div>
                </div>
                <div class="gallery-item" data-category="summer" data-title="Golden Sunset" data-season="Summer">
                    <img src="images/golden sunset.jpg" alt="Golden Sunset" loading="lazy">
                    <div class="image-number">
                        07
                    </div>
                </div>
                <div class="gallery-item" data-category="summer" data-title="Tropical Paradise" data-season="Summer">
                    <img src="images/tropical paradise.jpg" alt="Tropical Paradise" loading="lazy">

                    <div class="image-number">
                        08
                    </div>
                </div>
                <div class="gallery-item" data-category="autumn" data-title="Autumn Forest" data-season="Autumn">
                    <img src="images/autum forest.jpg" alt="Autumn Forest" loading="lazy">
                    <div class="image-number">
                        09
                    </div>
                </div>
                <div class="gallery-item" data-category="autumn" data-title="Falling Leaves" data-season="Autumn">
                    <img src="images/falling leaves.jpg" alt="Falling Leaves" loading="lazy">
                    <div class="image-number">
                        10
                    </div>
                </div>
                  <div class="gallery-item" data-category="autumn" data-title="Autumn Garden" data-season="Autumn">
                    <img src="images/autum garden.jpg" alt="Autum garden" loading="lazy">
                    <div class="image-number">
                        11
                    </div>
                </div>
                <div class="gallery-item" data-category="autumn" data-title="Golden Road" data-season="Autumn">
                    <img src="images/golden road.jpg" alt="Golden Road" loading="lazy">
                    <div class="image-number">
                        12
                    </div>
                </div>
                <div class="gallery-item" data-category="winter" data-title="Snowy Mountains" data-season="Winter">
                    <img src="images/Snowy mountain.jpg" alt="Snowy Mountains" loading="lazy">

                    <div class="image-number">
                        13
                    </div>
                </div>
                  <div class="gallery-item" data-category="winter" data-title="Snowfall" data-season="Winter">
                    <img src="images/snowfall.jpg" alt="Snowfall" loading="lazy">
                    <div class="image-number">
                        14
                    </div>
                </div>
                <div class="gallery-item" data-category="winter" data-title="Frozen Lake" data-season="Winter">
                    <img src="images/frozen lake.jpg" alt="Frozen Lake" loading="lazy">
                    <div class="image-number">
                        15
                    </div>
                </div>
                 <div class="gallery-item" data-category="winter" data-title="Winter Wonderland" data-season="Winter">
                    <img src="images/winter wonderland.jpg" alt="Winter Wonderland" loading="lazy">
                    <div class="image-number">
                        16
                    </div>
                </div>

            </div>
        </section>
    </main>
    <div class="lightbox" id="lightbox">
        <button class="close-btn" id="closeBtn" aria-label="Close">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <button class="lightbox-arrow prev" id="prevBtn" aria-label="Previous image">
            <i class="fa-solid fa-chevron-left"></i>
        </button>
        <div class="lightbox-content">
            <img id="lightboxImage" src="" alt="">
            <div class="lightbox-details">
                <p id="lightboxSeason"></p>
                <h2 id="lightboxTitle"></h2>
            </div>
        </div>
        <button class="lightbox-arrow next" id="nextBtn" aria-label="Next image">
            <i class="fa-solid fa-chevron-right"></i>
        </button>
    </div>
    <footer>
         <div class="footer-logo">
            <span>Season</span>Scope
        </div> 
        <div class="footer-content">
            <p class="copyright">&copy; 2026 Laiba Ajmal | All Rights Reserved. </p>
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
